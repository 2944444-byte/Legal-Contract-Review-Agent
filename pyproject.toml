[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-contract-review-agent"
version = "0.1.0"
description = "Decision-support tool that flags risky contract clauses. NOT legal advice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.9",
]

[project.optional-dependencies]
# Model-backed analysis (analyze_clause). Optional so the offline heuristic
# pipeline works with zero extra dependencies.
model = ["anthropic>=0.40"]
# Document parsing for non-TXT formats.
pdf = ["pdfplumber>=0.11"]
docx = ["python-docx>=1.1"]
# Everything, for a full install.
all = ["anthropic>=0.40", "pdfplumber>=0.11", "python-docx>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
legal-agent = "legal_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
